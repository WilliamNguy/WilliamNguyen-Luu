<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>William Nguyen-Luu</title>
  <link rel="stylesheet" href="css/projects.css">
  <script>
    const lexend = new FontFace('Lexend', 'url(assets/fonts/Lexend.ttf)');
    lexend.load().then(font => document.fonts.add(font));

    const notable = new FontFace('Notable', 'url(assets/fonts/Notable.ttf)');
    notable.load().then(font => document.fonts.add(font));

    const basker = new FontFace('BaskerItalic', 'url(assets/fonts/BaskerItalic.ttf)');
    basker.load().then(font => document.fonts.add(font));

    const nohemiRegular = new FontFace(
    'Nohemi',
    'url(assets/fonts/Nohemi-Regular.ttf)',
    { weight: '400' }
);

const nohemiMedium = new FontFace(
    'Nohemi',
    'url(assets/fonts/Nohemi-Medium.ttf)',
    { weight: '500' }
);

const nohemiSemiBold = new FontFace(
    'Nohemi',
    'url(assets/fonts/Nohemi-SemiBold.ttf)',
    { weight: '600' }
);

Promise.all([
    nohemiRegular.load(),
    nohemiMedium.load(),
    nohemiSemiBold.load()
]).then(fonts => {
    fonts.forEach(font => document.fonts.add(font));
});
  </script>
</head>

<body>
  <script src="js/projects.js"></script>

</body>

</html>
