<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Environments — William Nguyen-Luu</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/projects.css" />

    <script>
        const lexend = new FontFace(
            'Lexend',
            'url(assets/fonts/Lexend.ttf)'
        );
        lexend.load().then(font => document.fonts.add(font));

        const notable = new FontFace(
            'Notable',
            'url(assets/fonts/Notable.ttf)'
        );
        notable.load().then(font => document.fonts.add(font));

        const basker = new FontFace(
            'BaskerItalic',
            'url(assets/fonts/BaskerItalic.ttf)'
        );
        basker.load().then(font => document.fonts.add(font));
    </script>

</head>


<body style="background-color: #f5f5f5;">


    <!-- ========================================
         ENVIRONMENTS
    ========================================= -->

    <div id="project-wrapper">


        <!-- ========================================
             PAGE TITLE
        ========================================= -->

        <section class="project-info">

            <div class="project-heading">

                <h1>ENVIRONMENTS</h1>

                <p class="project-type">
                    3D Environment Design · 2026
                </p>

            </div>

        </section>



        <!-- ========================================
             PROJECT GALLERY
        ========================================= -->

        <div
            id="project-container"
            style="
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 4vw;
                padding: 0 5vw 15vh 5vw;
            "
        >


            <!-- ========================================
                 GRASS ENVIRONMENT — IMAGE 1
            ========================================= -->

            <img
                class="environment-media grass-media"
                src="assets/images/TEST_1024.png"
                alt="Grass Environment"
                style="
                    width: 40vw;
                    border-radius: 0px;
                    object-fit: cover;
                    cursor: none;
                    transition: transform 0.3s ease;
                "
            >



            <!-- ========================================
                 GRASS ENVIRONMENT — IMAGE 2
            ========================================= -->

            <img
                class="environment-media grass-media"
                src="assets/images/TEST_1024_frame001.png"
                alt="Grass Environment"
                style="
                    width: 40vw;
                    border-radius: 0px;
                    object-fit: cover;
                    cursor: none;
                    transition: transform 0.3s ease;
                "
            >



            <!-- ========================================
                 GRASS ENVIRONMENT — IMAGE 3
            ========================================= -->

            <img
                class="environment-media grass-media"
                src="assets/images/grass_path2.png"
                alt="Grass Environment"
                style="
                    width: 40vw;
                    border-radius: 0px;
                    object-fit: contain;
                    cursor: none;
                    transition: transform 0.3s ease;
                "
            >



            <!-- ========================================
                 GRASS ENVIRONMENT — ANIMATION
            ========================================= -->

            <video
                class="environment-media grass-media"
                src="assets/videos/grassVideo.mp4"
                style="
                    width: 40vw;
                    border-radius: 0px;
                    object-fit: cover;
                    cursor: none;
                    transition: transform 0.3s ease;
                "
                autoplay
                muted
                loop
                playsinline
            >
            </video>



            <!-- ========================================
                 FOREST ENVIRONMENT
            ========================================= -->

            <img
                class="environment-media forest-media"
                src="assets/images/topDown.png"
                alt="Top Down Forest Environment"
                style="
                    width: 40vw;
                    border-radius: 0px;
                    object-fit: cover;
                    cursor: none;
                    transition: transform 0.3s ease;
                "
            >



            <!-- ========================================
                 GRASS — BEHIND THE SCENES
            ========================================= -->

            <video
                class="environment-media bts-media"
                src="assets/videos/bts_grass.mp4"
                style="
                    width: 40vw;
                    border-radius: 0px;
                    object-fit: cover;
                    cursor: none;
                    transition: transform 0.3s ease;
                "
                autoplay
                muted
                loop
                playsinline

            </video>


        </div>

    </div>



    <!-- ========================================
         NAVBAR
    ========================================= -->

    <script src="js/navbar.js"></script>



    <!-- ========================================
         ENVIRONMENT HOVER SYSTEM
    ========================================= -->

    <script>


        // ========================================
        // PROJECT DESCRIPTIONS
        // ========================================

        const environmentInfo = {


            // GRASS ENVIRONMENT

            grassDescription:
                'A custom vegetation environment built from individually modeled grass strands, assembled into three main variations: short grass, tall grass, and dry brown grass. UV mapping and custom textures were used to control surface appearance and variation across the vegetation. The grass was connected to proxy objects to keep the scene lightweight and make viewport navigation more efficient. Flowers were created using the same modular approach, combining individually modeled stems, leaves, and petals. Each vegetation proxy uses randomized X, Y, and Z movement to introduce variation and simulate natural wind throughout the environment.',


            // FOREST ENVIRONMENT

            forestDescription:
                'A top-down forest environment built from six individually modeled tree variations. The trees were distributed using the same proxy-based system as the grass environment, allowing a dense forest to be created while keeping the scene efficient to navigate and edit. Volumetric clouds were created from a mesh cube using shader nodes, while an HDRI provided the environmental lighting and helped establish the overall atmosphere of the scene.',


            // GRASS — BEHIND THE SCENES

            btsDescription:
                'A behind-the-scenes viewport view of the grass environment, revealing the underlying structure used to build and animate the scene. The simplified proxy objects show how the vegetation patches are distributed and controlled, allowing the environment to remain lightweight while working in Blender. The viewport also demonstrates how randomized movement is applied across the proxies to create the wind animation visible in the final render.'

        };



        // ========================================
        // CREATE HOVER TEXT
        // ========================================

        const projectCursor =
            document.createElement('div');


        Object.assign(projectCursor.style, {

            position: 'fixed',

            width: '38vw',

            fontFamily: 'Lexend',

            fontSize: '0.8vw',

            lineHeight: '1.5',

            color: '#FFEA00',

            // Straight left + right paragraph edges
            textAlign: 'justify',

            // Improves visibility over images/videos
            textShadow:
                '0 1px 5px rgba(0, 0, 0, 0.45)',

            pointerEvents: 'none',

            zIndex: '2000',

            opacity: '0',

            // Centers paragraph around mouse
            transform: 'translate(-50%, -50%)',

            transition: 'opacity 0.2s ease'

        });


        document.body.appendChild(projectCursor);



        // ========================================
        // GET ALL PROJECT MEDIA
        // ========================================

        const environmentMedia =
            document.querySelectorAll('.environment-media');



        // ========================================
        // HOVER EFFECT
        // ========================================

        environmentMedia.forEach(media => {


            // ------------------------------------
            // MOUSE ENTER
            // ------------------------------------

            media.addEventListener('mouseenter', () => {


                // FOREST ENVIRONMENT

                if (media.classList.contains('forest-media')) {

                    projectCursor.textContent =
                        environmentInfo.forestDescription;

                }


                // GRASS BTS

                else if (media.classList.contains('bts-media')) {

                    projectCursor.textContent =
                        environmentInfo.btsDescription;

                }


                // GRASS ENVIRONMENT

                else {

                    projectCursor.textContent =
                        environmentInfo.grassDescription;

                }



                projectCursor.style.opacity = '1';

                media.style.transform = 'scale(1.03)';

            });



            // ------------------------------------
            // FOLLOW MOUSE
            // ------------------------------------

            media.addEventListener('mousemove', (e) => {

                projectCursor.style.left =
                    `${e.clientX}px`;

                projectCursor.style.top =
                    `${e.clientY}px`;

            });



            // ------------------------------------
            // MOUSE LEAVE
            // ------------------------------------

            media.addEventListener('mouseleave', () => {

                projectCursor.style.opacity = '0';

                media.style.transform = 'scale(1)';

            });


        });


    </script>


</body>

</html>
