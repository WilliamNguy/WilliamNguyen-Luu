<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>William Nguyen-Luu</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/projects.css" />
    <style>
        #project-container img {
            width: min(26vw, 360px);
            height: auto;
        }

        @media (max-width: 700px) {
            #project-container img {
                width: 40vw;
            }
        }
    </style>
    <script>
        const lexend = new FontFace('Lexend', 'url(assets/fonts/Lexend.ttf)');
        lexend.load().then(font => document.fonts.add(font));

        const notable = new FontFace('Notable', 'url(assets/fonts/Notable.ttf)');
        notable.load().then(font => document.fonts.add(font));

        const basker = new FontFace('BaskerItalic', 'url(assets/fonts/BaskerItalic.ttf)');
        basker.load().then(font => document.fonts.add(font));

        const nohemiRegular = new FontFace(
    'Nohemi',
    'url(assets/fonts/Nohemi-Regular.ttf)',
    { weight: '400' }
);

const nohemiMedium = new FontFace(
    'Nohemi',
    'url(assets/fonts/Nohemi-Medium.ttf)',
    { weight: '500' }
);

const nohemiSemiBold = new FontFace(
    'Nohemi',
    'url(assets/fonts/Nohemi-SemiBold.ttf)',
    { weight: '600' }
);

Promise.all([
    nohemiRegular.load(),
    nohemiMedium.load(),
    nohemiSemiBold.load()
]).then(fonts => {
    fonts.forEach(font => document.fonts.add(font));
});
    </script>
</head>

<body>
    <div id="project-container"
        style="display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: center; gap: 3vw; padding: 15vh 5vw;">
        <img src="assets/images/Prada.png" alt="Prada 3D model">
        <img src="assets/images/burp.png" alt="Burp 3D model">
        <img src="assets/images/vale.png" alt="Vale 3D model">
        <img src="assets/images/Fruit_Loops_Final(_).png">
        <img src="assets/images/donut_trial.png">
        <img src="assets/images/Final Lego Coffee.png">
        <img src="assets/images/ 2.0.png">
        <img src="assets/images/part3.png">
        <img src="assets/images/candle_lighting.png">
        <img src="assets/images/container_lighting_3.png">
        <img src="assets/images/grey_room.png">
        <img src="assets/images/pink_room.png">
        <img src="assets/images/Low_Poly_Final.png">
        <!-- Add more images as needed -->
    </div>

    <!-- JavaScript files -->
    <script src="js/navbar.js"></script>
    <!-- <script src="js/projects.js"></script> -->
</body>

</html>
